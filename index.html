<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Subscribe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }
        .box { 
            background: #fff; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); 
        }
        .icon { font-size: 50px; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 8px; font-size: 22px; }
        .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
        .yt-btn { 
            display: inline-block; 
            background: #ff0000; 
            color: #fff; 
            padding: 10px 22px; 
            border-radius: 25px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-bottom: 18px; 
        }
        .yt-btn:hover { background: #cc0000; }
        .upload { 
            border: 2px dashed #ddd; 
            border-radius: 12px; 
            padding: 22px; 
            cursor: pointer; 
            margin-bottom: 15px; 
        }
        .upload:hover { border-color: #667eea; background: #f8f9ff; }
        .upload.done { border-color: #4caf50; border-style: solid; }
        .upload-icon { font-size: 32px; margin-bottom: 6px; }
        .upload-text { color: #666; font-size: 14px; }
        #preview { 
            max-width: 100%; 
            max-height: 130px; 
            border-radius: 8px; 
            display: none; 
            margin: 10px auto 0; 
        }
        #file { display: none; }
        .submit { 
            display: none; 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .submit:hover { opacity: 0.9; }
        .loading { display: none; padding: 25px 0; }
        .spinner { 
            width: 45px; 
            height: 45px; 
            border: 4px solid #eee; 
            border-top: 4px solid #667eea; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 12px; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #333; font-size: 15px; }
        .bar { 
            width: 100%; 
            height: 6px; 
            background: #eee; 
            border-radius: 3px; 
            margin-top: 15px; 
            overflow: hidden; 
        }
        .bar-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #667eea, #764ba2); 
            width: 0%; 
        }
        .success { display: none; }
        .success-icon { font-size: 55px; margin-bottom: 10px; }
        .success h2 { color: #4caf50; }
        .success p { color: #666; margin-bottom: 18px; font-size: 14px; }
        .link-box {
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            word-break: break-all;
            font-size: 13px;
            color: #333;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .access { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #11998e, #38ef7d); 
            color: #fff; 
            padding: 14px 25px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-size: 16px; 
            font-weight: bold; 
            box-shadow: 0 8px 25px rgba(17,153,142,0.4);
            border: none;
            cursor: pointer;
        }
        .access:hover { transform: scale(1.05); color: #fff; }
        .copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff; 
            padding: 14px 25px; 
            border-radius: 50px; 
            font-size: 16px; 
            font-weight: bold; 
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            border: none;
            cursor: pointer;
        }
        .copy-btn:hover { transform: scale(1.05); }
        .copy-btn.copied { background: linear-gradient(135deg, #4caf50, #8bc34a); }
        .hide { display: none !important; }
    </style>
</head>
<body>
    <div class="box">
        <div id="s1">
            <div class="icon">📺</div>
            <h2>Xác thực Subscriber</h2>
            <p class="sub">Upload ảnh chụp màn hình đã Subscribe</p>
            <a href="https://www.youtube.com/@KaiDuiDe90?sub_confirmation=1" target="_blank" class="yt-btn">🔔 Subscribe Kênh</a>
            <div class="upload" id="upload" onclick="document.getElementById('file').click()">
                <div class="upload-icon">📤</div>
                <div class="upload-text" id="txt">Nhấn để chọn ảnh</div>
                <img id="preview">
            </div>
            <input type="file" id="file" accept="image/*">
            <button class="submit" id="btn" onclick="verify()">✅ Xác nhận đăng ký</button>
        </div>
        <div class="loading" id="s2">
            <div class="spinner"></div>
            <div class="loading-text">🔍 Đang xác nhận đăng ký...</div>
            <div class="bar"><div class="bar-fill" id="bar"></div></div>
        </div>
        <div class="success" id="s3">
            <div class="success-icon">🎉</div>
            <h2>Xác thực thành công!</h2>
            <p>Cảm ơn bạn đã Subscribe!</p>
            <div class="link-box" id="link-display">https://kaiduide.github.io/dangky/</div>
            <div class="btn-group">
                <a href="https://kaiduide.github.io/dangky/" target="_blank" class="access">🚀 Mở link</a>
                <button class="copy-btn" id="copy-btn" onclick="copyLink()">📋 Copy link</button>
            </div>
        </div>
    </div>
    <script>
        var SECRET_LINK = 'https://kaiduide.github.io/dangky/';
        var file = document.getElementById('file');
        var preview = document.getElementById('preview');
        var upload = document.getElementById('upload');
        var txt = document.getElementById('txt');
        var btn = document.getElementById('btn');
        if(localStorage.getItem('done') === '1') {
            document.getElementById('s1').classList.add('hide');
            document.getElementById('s3').style.display = 'block';
        }
        file.onchange = function(e) {
            var f = e.target.files[0];
            if(f) {
                var r = new FileReader();
                r.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    txt.textContent = 'Nhấn để đổi ảnh';
                    upload.classList.add('done');
                    btn.style.display = 'block';
                };
                r.readAsDataURL(f);
            }
        };
        function verify() {
            document.getElementById('s1').classList.add('hide');
            document.getElementById('s2').style.display = 'block';
            var bar = document.getElementById('bar');
            var p = 0;
            var t = setInterval(function() {
                p += Math.random() * 18;
                if(p > 100) p = 100;
                bar.style.width = p + '%';
            }, 150);
            setTimeout(function() {
                clearInterval(t);
                bar.style.width = '100%';
                setTimeout(function() {
                    document.getElementById('s2').style.display = 'none';
                    document.getElementById('s3').style.display = 'block';
                    localStorage.setItem('done', '1');
                }, 300);
            }, 3000);
        }
        function copyLink() {
            var copyBtn = document.getElementById('copy-btn');
            navigator.clipboard.writeText(SECRET_LINK).then(function() {
                copyBtn.innerHTML = '✅ Đã copy!';
                copyBtn.classList.add('copied');
                setTimeout(function() {
                    copyBtn.innerHTML = '📋 Copy link';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(function() {
                var textArea = document.createElement('textarea');
                textArea.value = SECRET_LINK;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                copyBtn.innerHTML = '✅ Đã copy!';
                copyBtn.classList.add('copied');
                setTimeout(function() {
                    copyBtn.innerHTML = '📋 Copy link';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
