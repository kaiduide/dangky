<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Subscribe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }
        .box { 
            background: #fff; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); 
        }
        .icon { font-size: 50px; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 8px; font-size: 22px; }
        .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
        .yt-btn { 
            display: inline-block; 
            background: #ff0000; 
            color: #fff; 
            padding: 10px 22px; 
            border-radius: 25px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-bottom: 18px; 
        }
        .yt-btn:hover { background: #cc0000; }
        .upload { 
            border: 2px dashed #ddd; 
            border-radius: 12px; 
            padding: 22px; 
            cursor: pointer; 
            margin-bottom: 15px; 
        }
        .upload:hover { border-color: #667eea; background: #f8f9ff; }
        .upload.done { border-color: #4caf50; border-style: solid; }
        .upload-icon { font-size: 32px; margin-bottom: 6px; }
        .upload-text { color: #666; font-size: 14px; }
        #preview { 
            max-width: 100%; 
            max-height: 130px; 
            border-radius: 8px; 
            display: none; 
            margin: 10px auto 0; 
        }
        #file { display: none; }
        .submit { 
            display: none; 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .submit:hover { opacity: 0.9; }
        .loading { display: none; padding: 25px 0; }
        .spinner { 
            width: 45px; 
            height: 45px; 
            border: 4px solid #eee; 
            border-top: 4px solid #667eea; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 12px; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #333; font-size: 15px; }
        .bar { 
            width: 100%; 
            height: 6px; 
            background: #eee; 
            border-radius: 3px; 
            margin-top: 15px; 
            overflow: hidden; 
        }
        .bar-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #667eea, #764ba2); 
            width: 0%; 
        }
        .success { display: none; }
        .success-icon { font-size: 55px; margin-bottom: 10px; }
        .success h2 { color: #4caf50; }
        .success p { color: #666; margin-bottom: 18px; font-size: 14px; }
        .access { 
            display: inline-block; 
            background: linear-gradient(135deg, #11998e, #38ef7d); 
            color: #fff; 
            padding: 14px 35px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-size: 17px; 
            font-weight: bold; 
            box-shadow: 0 8px 25px rgba(17,153,142,0.4); 
        }
        .access:hover { transform: scale(1.05); }
        .hide { display: none !important; }
    </style>
</head>
<body>
    <div class="box">
        
        <!-- BƯỚC 1 -->
        <div id="s1">
            <div class="icon">📺</div>
            <h2>Xác thực Subscriber</h2>
            <p class="sub">Upload ảnh chụp màn hình đã Subscribe</p>
            
            <!-- ★★★ THAY LINK KÊNH YOUTUBE CỦA BẠN ★★★ -->
            <a href="https://www.youtube.com/@KaiDuiDe90?sub_confirmation=1" target="_blank" class="yt-btn">
                🔔 Subscribe Kênh
            </a>
            
            <div class="upload" id="upload" onclick="document.getElementById('file').click()">
                <div class="upload-icon">📤</div>
                <div class="upload-text" id="txt">Nhấn để chọn ảnh</div>
                <img id="preview">
            </div>
            <input type="file" id="file" accept="image/*">
            <button class="submit" id="btn" onclick="verify()">✅ Xác nhận đăng ký</button>
        </div>
        
        <!-- BƯỚC 2 -->
        <div class="loading" id="s2">
            <div class="spinner"></div>
            <div class="loading-text">🔍 Đang xác nhận đăng ký...</div>
            <div class="bar"><div class="bar-fill" id="bar"></div></div>
        </div>
        
        <!-- BƯỚC 3 -->
        <div class="success" id="s3">
            <div class="success-icon">🎉</div>
            <h2>Xác thực thành công!</h2>
            <p>Cảm ơn bạn đã Subscribe!</p>
            
            <!-- ★★★ THAY LINK WEBSITE CỦA BẠN ★★★ -->
            <a href="https://lmarena.ai/" class="access">🚀 Truy cập ngay</a>
        </div>
        
    </div>

    <script>
        var file = document.getElementById('file');
        var preview = document.getElementById('preview');
        var upload = document.getElementById('upload');
        var txt = document.getElementById('txt');
        var btn = document.getElementById('btn');
        
        // Đã xác thực trước đó
        if(localStorage.getItem('done') === '1') {
            document.getElementById('s1').classList.add('hide');
            document.getElementById('s3').style.display = 'block';
        }
        
        // Chọn file
        file.onchange = function(e) {
            var f = e.target.files[0];
            if(f) {
                var r = new FileReader();
                r.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    txt.textContent = 'Nhấn để đổi ảnh';
                    upload.classList.add('done');
                    btn.style.display = 'block';
                };
                r.readAsDataURL(f);
            }
        };
        
        // Xác nhận
        function verify() {
            document.getElementById('s1').classList.add('hide');
            document.getElementById('s2').style.display = 'block';
            
            var bar = document.getElementById('bar');
            var p = 0;
            var t = setInterval(function() {
                p += Math.random() * 18;
                if(p > 100) p = 100;
                bar.style.width = p + '%';
            }, 150);
            
            setTimeout(function() {
                clearInterval(t);
                bar.style.width = '100%';
                setTimeout(function() {
                    document.getElementById('s2').style.display = 'none';
                    document.getElementById('s3').style.display = 'block';
                    localStorage.setItem('done', '1');
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
